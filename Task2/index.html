
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <p class="tag">MY DAILY PLANNER</p>
            <h1>My To-Do List <span>✓</span></h1>
            <p class="subtitle">Plan your day. Complete your goals.</p>
        </header>

        <section class="task-box">
            <form id="taskForm">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                    required
                >
                <button type="submit" id="addButton">+ Add Task</button>
            </form>

            <div class="summary">
                <div class="summary-card">
                    <span id="totalTasks">0</span>
                    <p>Total Tasks</p>
                </div>
                <div class="summary-card">
                    <span id="pendingTasks">0</span>
                    <p>Pending</p>
                </div>
                <div class="summary-card">
                    <span id="completedTasks">0</span>
                    <p>Completed</p>
                </div>
            </div>

            <div class="filters">
                <button class="filter active" data-filter="all">All</button>
                <button class="filter" data-filter="pending">Pending</button>
                <button class="filter" data-filter="completed">Completed</button>
            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">✨ No tasks here. Add your first task!</p>

            <button type="button" id="clearCompleted" class="clear-btn">
                Clear Completed Tasks
            </button>
        </section>

        <footer>
            Made with care · Stay focused and productive!
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
